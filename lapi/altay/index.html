</div>`;

}

function navigate(dir){
const next=currentIdx+dir;

}

function closeModal(e){
if(e&&e.target!==document.getElementById('modal'))return;
document.getElementById('modal').classList.remove('show');
document.body.style.overflow='';
const v=document.querySelector('.modal-film video');if(v)v.pause();
}

function filter(type){
activeFilter=type;
document.querySelectorAll('.filter-tag').forEach(t=>t.classList.toggle('active',t.textContent===type||(type==='all'&&t.textContent==='全部')));
filtered=type==='all'?shots:shots.filter(s=>{
const a=s.analysis||{};return[a.shot_size,a.camera_movement,a.color_tone].filter(Boolean).join(' ').includes(type)});
render();
}

let touchStartX=0;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX});

if(!document.getElementById('modal').classList.contains('show'))return;
const dx=e.changedTouches[0].clientX-touchStartX;
if(dx>60)navigate(-1);
if(dx<-60)navigate(1);
});
document.addEventListener('keydown',e=>{
if(!document.getElementById('modal').classList.contains('show'))return;
if(e.key==='ArrowLeft')navigate(-1);
if(e.key==='ArrowRight')navigate(1);

});
