<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #08080a; color: #d4d4d8; }

.header {
    background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d1b2a 100%);
    padding: 36px 48px;
    border-bottom: 2px solid #e94560;
}
.header h1 { font-size: 2em; color: #fff; font-weight: 700; }
.header .sub { color: #888; margin-top: 6px; font-size: 0.92em; }
.header .meta { display: flex; gap: 24px; margin-top: 12px; }
.header .meta-item { background: rgba(255,255,255,0.06); padding: 6px 14px; border-radius: 6px; font-size: 0.85em; color: #aaa; }

/* Filter bar */
.filter-bar {
    display: flex; gap: 8px; padding: 16px 48px; background: #0c0c14;
    border-bottom: 1px solid #222; flex-wrap: wrap;
}
.filter-tag {
    padding: 4px 12px; border-radius: 14px; font-size: 0.82em;
    cursor: pointer; border: 1px solid #333; background: transparent; color: #888;
    transition: all 0.2s; font-family: inherit;
}
.filter-tag:hover { border-color: #e94560; color: #e94560; }
.filter-tag.active { background: #e94560; color: #fff; border-color: #e94560; }

/* Nav */
.nav-tabs { display: flex; gap: 0; background: #0c0c14; border-bottom: 2px solid #222; padding: 0 48px; }
.nav-tab {
    padding: 14px 24px; cursor: pointer; border: none; background: none;
    color: #777; font-size: 0.95em; transition: all 0.2s; font-family: inherit;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
}
.nav-tab:hover { color: #ccc; }
.nav-tab.active { color: #e94560; border-bottom-color: #e94560; }

.view { display: none; padding: 24px 48px; }
.view.active { display: block; }

/* Timeline grid */
.timeline-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
}
.shot-card {
    background: #12121a; border-radius: 12px; overflow: hidden;
    cursor: pointer; transition: all 0.3s;
    border: 2px solid transparent; position: relative;
}
.shot-card:hover {
    transform: translateY(-4px);
    border-color: #e94560;
    box-shadow: 0 12px 32px rgba(233,69,96,0.15);
}
.shot-card .thumb-wrap {
    width: 100%; height: 130px; overflow: hidden; position: relative;
    background: #000; display: flex; align-items: center; justify-content: center;
}
.shot-card video {
    width: 100%; height: 130px; object-fit: contain; background: #000;
    display: block;
}
.shot-card .thumb-static {
    width: 100%; height: 130px; object-fit: contain;
    display: block;
}
.shot-card .play-badge {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.7); color: #e94560;
    padding: 2px 8px; border-radius: 10px; font-size: 0.7em;
}
.shot-card .shot-meta { padding: 10px 12px; }
.shot-card .shot-id { color: #e94560; font-size: 0.8em; font-weight: bold; }
.shot-card .shot-time { color: #aaa; font-size: 0.78em; float: right; }
.shot-card .shot-tags { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.shot-card .tag { font-size: 0.72em; padding: 1px 6px; border-radius: 8px; background: #1e1e2e; color: #888; }

/* Summary */
.summary-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px; margin-bottom: 24px;
}
.sum-card {
    background: #12121a; border-radius: 12px; padding: 16px; text-align: center;
}
.sum-card .num { font-size: 1.8em; font-weight: bold; color: #e94560; }
.sum-card .label { font-size: 0.8em; color: #777; margin-top: 4px; }

/* Stats */
.stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 20px;
}
.stat-card { background: #12121a; border-radius: 14px; padding: 20px; }
.stat-card h3 { color: #e94560; font-size: 1em; margin-bottom: 14px; }
.chart-wrap { position: relative; height: 240px; }

/* Modal */
.modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    z-index: 1000; overflow-y: auto; padding: 24px;
}
.modal-overlay.show { display: flex; align-items: flex-start; justify-content: center; }
.modal-box {
    background: #12121a; border-radius: 16px; max-width: 800px; width: 100%;
    margin: 20px 0; overflow: hidden;
}
.modal-close {
    position: fixed; top: 16px; right: 24px;
    background: rgba(255,255,255,0.1); border: none; color: #fff;
    width: 40px; height: 40px; border-radius: 50%; font-size: 1.5em;
    cursor: pointer; z-index: 1002; display: flex; align-items: center; justify-content: center;
}
.modal-film {
    width: 100%; background: #000; display: flex; align-items: center; justify-content: center;
}
.modal-film video { width: 100%; max-height: 400px; }
.modal-body { padding: 20px 24px; }
.modal-body h2 { font-size: 1.2em; color: #e94560; margin-bottom: 6px; }
.modal-desc { color: #aaa; font-size: 0.9em; margin-bottom: 16px; line-height: 1.6; }
.detail-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
}
.detail-item {
    background: #1a1a28; padding: 10px 14px; border-radius: 8px;
}
.detail-item .dl { color: #666; font-size: 0.75em; margin-bottom: 3px; }
.detail-item .dv { color: #e0e0e0; font-size: 0.88em; }

@media (max-width: 768px) {
    .header, .filter-bar, .nav-tabs, .view { padding-left: 16px; padding-right: 16px; }
    .timeline-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .stats-grid { grid-template-columns: 1fr; }
}
</style>
</head>

// === Summary ===
function renderSummary(filtered) {
    const total = filtered.length;
    const totalDur = filtered.reduce((sum, s) => sum + s.length_sec, 0);
    const avgLen = total > 0 ? (totalDur / total).toFixed(1) : 0;
    const min = Math.floor(totalDur / 60);
    const sec = Math.round(totalDur % 60);
    const analyzed = filtered.filter(s => s.analysis && !s.analysis.error).length;

    document.getElementById('summaryRow').innerHTML = `
        <div class="sum-card"><div class="num">${total}</div><div class="label">镜头数</div></div>
        <div class="sum-card"><div class="num">${analyzed}</div><div class="label">已分析</div></div>
        <div class="sum-card"><div class="num">${min}:${String(sec).padStart(2,'0')}</div><div class="label">总时长</div></div>
        <div class="sum-card"><div class="num">${avgLen}s</div><div class="label">平均时长</div></div>
    `;
}

// === Timeline ===
function renderTimeline(filtered) {
    const grid = document.getElementById('timelineGrid');
    grid.innerHTML = filtered.map((s, idx) => {
        const a = s.analysis || {};
        const clipPath = s.clip_path || '';
        const time = formatTime(s.start_sec || 0);
        const tags = [a.shot_size, a.camera_movement, a.color_tone].filter(Boolean);

        const vidHtml = clipPath
            ? `<video src="${clipPath}" muted loop preload="none" playsinline
                 onmouseenter="this.play()" onmouseleave="this.pause();this.currentTime=0"></video>`
            : `<div class="thumb-static" style="background:#1a1a2e;display:flex;align-items:center;justify-content:center;color:#444;">#{s.id}</div>`;

        return `
        <div class="shot-card" onclick="showDetail(${idx})">
            <div class="thumb-wrap">
                ${vidHtml}
                ${clipPath ? '<span class="play-badge">▶ 悬停播放</span>' : ''}
            </div>
            <div class="shot-meta">
                <span class="shot-id">#${s.idx || s.id}</span>
                <span class="shot-time">${time}</span>
                <div class="shot-tags">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
            </div>
        </div>`;
    }).join('');
}

function formatTime(sec) {
    const s = sec || 0;
    const m = Math.floor(s / 60);
    const ss = Math.floor(s % 60);
    return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}

// === Detail Modal ===
function showDetail(idx) {
    const s = shotsData[idx];
    const a = s.analysis || {};
    const clipPath = s.clip_path || '';
    const time = formatTime(s.start_sec || 0);

    const items = [
        ['🎥 景别', a.shot_size],
        ['🎬 运镜', a.camera_movement],
        ['📐 角度', a.camera_angle],
        ['💡 光型', a.light_type],
        ['☀️ 光向', a.light_direction],
        ['🎨 色调', a.color_tone],
        ['⏱️ 时长', (s.length_sec||0).toFixed(1) + 's'],
        ['⏰ 时间点', time],
        ['📐 构图', a.composition],
        ['📝 叙事功能', a.narrative_function],
        ['✂️ 剪辑逻辑', a.editing_type],
        ['💭 情绪基调', a.emotional_tone],
    ].filter(([label, val]) => val);

    const filmHtml = clipPath
        ? `<video src="${clipPath}" controls autoplay muted loop playsinline
             style="width:100%;display:block;max-height:400px;object-fit:contain;background:#000;"></video>`
        : '';

    document.getElementById('modalBox').innerHTML = `
        <div class="modal-film">${filmHtml}</div>
        <div class="modal-body">
            <h2>镜头 #${s.idx || s.id}</h2>
            <div class="modal-desc">${a.description || a.narrative_note || '（分析中...）'}</div>
            ${a.narrative_note ? `<div class="modal-desc" style="margin-top:-12px;color:#888;">📝 ${a.narrative_note}</div>` : ''}
            ${a.editing_note ? `<div class="modal-desc" style="margin-top:-12px;color:#888;">✂️ ${a.editing_note}</div>` : ''}
            <div class="detail-grid">
                ${items.map(([lab, val]) => `
                    <div class="detail-item">
                        <div class="dl">${lab}</div>
                        <div class="dv">${val}</div>
                    </div>
                `).join('')}
            </div>
        </div>
    `;

    document.getElementById('modal').classList.add('show');
    document.body.style.overflow = 'hidden';
}

function closeModal(e) {
    if (e && e.target !== document.getElementById('modal')) return;
    document.getElementById('modal').classList.remove('show');
    document.body.style.overflow = '';
    // Stop video playback
    const vid = document.querySelector('.modal-film video');
    if (vid) vid.pause();
}

// === Filter ===
let currentFilter = 'all';
function filterShots(type) {
    currentFilter = type;
    document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');

    const filtered = type === 'all'
        ? shotsData
        : shotsData.filter(s => {
            const a = s.analysis || {};
            const allText = [a.shot_size, a.camera_movement, a.color_tone, a.camera_angle,
                             a.light_type, a.light_direction, a.composition,
                             a.narrative_function, a.emotional_tone].filter(Boolean).join(' ');
            return allText.includes(type);
        });

    renderSummary(filtered);
    renderTimeline(filtered);
}

// === Tab ===
function switchView(name) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('view-' + name).classList.add('active');
    if (name === 'stats') renderCharts();
}

// === Charts ===
let chartsReady = false;
function renderCharts() {
    if (chartsReady) return;
    chartsReady = true;

    const colors = ['#e94560','#0f3460','#16213e','#533483','#e2c275','#1a936f','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316'];

    const doughnut = (canvasId, dataObj) => {
        const labels = Object.keys(dataObj);
        if (labels.length === 0) return;
        new Chart(document.getElementById(canvasId), {
            type: 'doughnut',
            data: { labels, datasets: [{ data: Object.values(dataObj), backgroundColor: colors }] },
            options: { responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'right', labels: { color: '#aaa', padding: 12 } } } }
        });
    };

    const barH = (canvasId, dataObj) => {
        const labels = Object.keys(dataObj);
        if (labels.length === 0) return;
        new Chart(document.getElementById(canvasId), {
            type: 'bar',
            data: { labels, datasets: [{ data: Object.values(dataObj), backgroundColor: '#e94560', borderRadius: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y',
                plugins: { legend: { display: false } },
                scales: { x: { ticks: { color: '#888' } }, y: { ticks: { color: '#888' } } } }
        });
    };

    doughnut('cSizes', statsData.shot_sizes);
    barH('cMoves', statsData.camera_moves);
    doughnut('cAngles', statsData.camera_angles);
    doughnut('cLight', statsData.light_types);
    doughnut('cLightDir', statsData.light_directions);
    doughnut('cTones', statsData.color_tones);
    barH('cComp', statsData.compositions);
    barH('cNarr', statsData.narrative_funcs);
    doughnut('cEmo', statsData.emotional_tones);

    // Duration histogram
    const bins = [0, 1, 2, 3, 5, 8, 12, 20, 50];
    const counts = bins.map(() => 0);
    statsData.durations.forEach(d => {
        for (let i = bins.length-1; i >= 0; i--) {
            if (d > bins[i]) { counts[i]++; break; }
        }
    });
    new Chart(document.getElementById('cDur'), {
        type: 'bar',
        data: {
            labels: bins.map((b, i) => i < bins.length-1 ? `${b}-{bins[i+1]}s` : `>${b}s`),
            datasets: [{ data: counts, backgroundColor: '#533483', borderRadius: 4 }]
        },
        options: { responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { ticks: { color: '#888' } }, y: { ticks: { color: '#888' } } } }
    });
}

// === Init ===
renderSummary(shotsData);
renderTimeline(shotsData);

// Keyboard: escape to close modal
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
